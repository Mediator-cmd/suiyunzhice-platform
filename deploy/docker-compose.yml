services:
  platform:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: suiyunzhice-platform:latest
    container_name: suiyunzhice-platform
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DB_PATH=/data/suiyun.db
      # 关闭内置模拟器时改为 1；接入真实设备后建议 SIM=0
      - SIM=${SIM:-1}
    volumes:
      - suiyun-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/meta"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 可选：Nginx 反向代理（配置域名与 HTTPS 时启用）
  # nginx:
  #   image: nginx:alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - ./certs:/etc/nginx/certs:ro
  #   depends_on:
  #     - platform

volumes:
  suiyun-data:
